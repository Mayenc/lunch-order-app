<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>LunchBox - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<link href="style_user.css" rel="stylesheet"/>
<link href="style_admin.css" rel="stylesheet"/>
</head>

<body>
<div class="container admin">

  <div class="header" style="text-align:left; margin-bottom:20px;">
    <div class="admin-header-top">
      <div class="admin-header-title">
        <span class="icon" style="display:inline;">🍱</span>
        <h1>LunchBox Admin</h1>
      </div>
      <button id="clearData" class="btn-clear">🗑 Xóa dữ liệu</button>
    </div>
    <p class="admin-sub">Quản lý thực đơn &amp; đơn đặt cơm hằng ngày</p>
  </div>

  <div class="admin-tabs">
    <button id="tabManage" class="admin-tab active">⚙️ Thực đơn</button>
    <button id="tabOrders" class="admin-tab">📋 Đơn hàng</button>
  </div>

  <!-- ================= MANAGE MENU ================= -->
  <section id="managePage" class="tab-page">

    <div class="card">
      <div class="card-title">🖼️ Ảnh thực đơn</div>
      <label for="menuUpload" class="upload-box">📷 Chọn ảnh menu để quét tự động</label>
      <input type="file" id="menuUpload" accept="image/*" hidden>
      <img id="preview" class="menu-preview" alt="">
      <div id="scanLoading" class="hidden scan-loading">🔍 Đang quét thực đơn, vui lòng chờ...</div>
    </div>

    <div class="card">
      <div class="card-title">🍽️ Danh sách món ăn</div>
      <div id="menuLines"></div>
      <button id="addMenuItem" class="btn-secondary full">+ Thêm món (vào Cơm)</button>
    </div>

    <div class="card">
      <div class="card-title">⏱️ Cấu hình đặt cơm</div>

      <label class="switch-row">
        <span>Cho phép đặt cơm</span>
        <input type="checkbox" id="enableOrder">
        <span class="switch"></span>
      </label>

      <div class="form-group">
        <label>Giờ chốt đơn (deadline)</label>
        <input type="time" id="deadline">
      </div>
    </div>

    <button id="saveMenu" class="btn-primary full">💾 Lưu thực đơn</button>
  </section>

  <!-- ================= ORDERS ================= -->
  <section id="ordersPage" class="tab-page hidden">

    <div class="card">
      <button id="toggleAddOther" class="btn-toggle-add full">
        <span>➕ Thêm món cho người khác</span>
        <span class="chevron">⌄</span>
      </button>
      <div id="addOtherPanel" class="add-other-panel">
        <div class="form-grid">
          <div class="form-group">
            <label>Người đặt</label>
            <select id="adminAddUser"><option value="">— Chọn tên —</option></select>
          </div>
          <div class="form-group">
            <label>Món ăn</label>
            <select id="adminAddFood"><option value="">— Chọn món —</option></select>
          </div>
          <div class="form-group">
            <label>Ngày đặt</label>
            <input type="date" id="adminAddDate">
          </div>
          <div class="form-group full">
            <label>Ghi chú</label>
            <input type="text" id="adminAddNote" placeholder="VD: ít cay, không hành, thêm rau...">
          </div>
        </div>
        <button id="adminAddOrderBtn" class="btn-primary full">➕ Thêm đơn</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Tổng hợp đơn hàng</div>

      <div class="mode-switch">
        <button id="modeDay" class="mode-btn active" data-mode="day">📅 Theo ngày</button>
        <button id="modeWeek" class="mode-btn" data-mode="week">🗓️ Theo tuần</button>
      </div>

      <div id="dayControls" class="filter-row">
        <select id="adminFilterDate"><option value="">loading...</option></select>
      </div>

      <div id="weekControls" class="filter-row hidden">
        <button id="prevWeek" class="btn-nav">‹</button>
        <span id="weekLabel" class="week-label"></span>
        <button id="nextWeek" class="btn-nav">›</button>
      </div>

      <button id="createWeekSheetBtn" class="btn-secondary full hidden">📊 Tạo sheet tổng cho tuần này</button>

      <div class="summary-header">
        <div class="badge-group">
          <span class="badge">Tổng: <b id="total">0</b> suất</span>
          <span class="badge badge-money">💰 <b id="totalMoney">0đ</b></span>
        </div>
        <div class="copy-btn-group">
          <span id="copySummary" class="btn-icon" title="Copy tổng hợp theo người">📄</span>
          <span id="copyDaySummary" class="btn-icon hidden" title="Copy tổng hợp theo ngày">📆</span>
        </div>
      </div>

      <div class="price-row">
        <label>Đơn giá / món</label>
        <input type="number" id="unitPrice" value="35000" step="1000" min="0">
        <span>đ</span>
      </div>

      <div id="summaryGrid" class="summary-list"></div>
    </div>

    <div class="card">
      <div class="card-title">📋 Chi tiết đơn hàng</div>

      <div class="detail-search-row">
        <input type="text" id="detailSearch" placeholder="🔍 Tìm theo tên người hoặc món ăn...">
        <button id="clearDetailSearch" class="btn-clear-search hidden" title="Xoá tìm kiếm">✕</button>
      </div>
      <div id="detailSearchInfo" class="detail-search-info hidden"></div>

      <div id="detailList"></div>
      <button id="exportTxt" class="btn-secondary full">⬇️ Xuất file TXT</button>
    </div>

  </section>

</div>

<div class="toast" id="toast"></div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text">Đang xử lý...</div>
  </div>
</div>

<script src="tesseract.min.js"></script>
<script src="app_admin.js"></script>
</body>
</html>
